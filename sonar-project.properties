# ─────────────────────────────────────────────────────────
# Configuración SonarQube para el proyecto CRUD Productos
# ─────────────────────────────────────────────────────────

# Identificación del proyecto
sonar.projectKey=crud-productos-maicol-piedrahita
sonar.projectName=CRUD Productos - Maicol Piedrahita
sonar.projectVersion=1.0.0

# Fuentes y tests
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Cobertura de código (generada por JaCoCo)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Lenguaje y encoding
sonar.language=java
sonar.java.source=25
sonar.sourceEncoding=UTF-8

# Exclusiones (no analizar código generado ni tests con SonarQube)
sonar.exclusions=**/app/Main.java
sonar.test.exclusions=src/test/**
